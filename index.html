<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>p5.js Water Tank</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
    <script src="sketch.js"></script>
</head>

<body> 
    <div id="canvas-container"></div>

    <!--Sliders-->
    <input type="range" id="top-slider"/>
    <input type="range" id="bot-slider"/>
    <input type="range" id="speedup-slider"/>
    <!-- Grouped buttons-->
    <div id="controls">
      <button id="fill-btn">Fill</button>
      <button id="drain-btn">Stop Fill</button>
      <button id="pause-btn">Pause Simulation</button>
      <button id="control-btn">Control 50%</button>
      <button id="clog-btn">Clog lower</button>
    </div>
</body>
</html>
