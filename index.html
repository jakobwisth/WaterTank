<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>p5.js Water Tank</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
    <script src="sketch.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
</head>

<body> 

    <div id="canvas-container"></div>

    <div id="inflow-slider-box">
        <div class="slider-title">Manual</div>
        <div class="slider-text"> u(t)</div>

        <div class="slider-paired-row">
          
          <input type="range" id="inflow-slider" min="0" max="100" value="0" />
          <div class="slider-labels">
            <div class="scale-label">1.0</div>
            <div class="scale-label">0.5</div>
            <div class="scale-label">0.0</div>
          </div>
        </div>
        <input type="number" id="inflow-value" min="0" max="1" step="0.01" value="0.0" />
    </div>

    <div id="setpoint-slider-box">
      <div class="slider-title">Setpoint</div>
      <div class="slider-text"> r</div>
      <div class="slider-paired-row">
        <input type="range" id="setpoint-slider" min="0" max="100" value="0" />
        <div class="slider-labels">
          <div class="scale-label">1.0</div>
          <div class="scale-label">0.5</div>
          <div class="scale-label">0.0</div>
        </div>
      </div>
      <input type="number" id="setpoint-value" min="0" max="1" step="0.01" value="0.0" />
  </div>

  <div id="speedup-slider-box">
    <div class="slider-labels">
      <div class="speedup-scale-label">1</div>
      <div class="speedup-scale-label">2</div>
      <div class="speedup-scale-label">3</div>
      <div class="speedup-scale-label">4</div>
    </div>
    <input type="range" id="speedup-slider" min="1" max="4" step="1">
  </div>
  


  <div id="PID-variables-slider-box">
    <div class = "PID-parameters">PID parameters</div>
    <div class="PID-titles">
      <div class="slider-title">K</div>
      <div class="slider-title">Ti</div>
      <div class="slider-title">Td</div>
    </div>
    <div class="slider-paired-row">
      <input type="range" id="Kp-slider" min="0" max="50" value="1"step="0.01" />
      <div class="slider-labels">
        <div class="scale-label">50.0</div>
        <div class="scale-label">0.0</div>
      </div>
      <input type="range" id="Ti-slider" min="0.1" max="50" value="1" step="0.01"/>
      <div class="slider-labels">
        <div class="scale-label">inf</div>
        <div class="scale-label">0.1</div>
      </div>
      <input type="range" id="Td-slider" min="0" max="50" value="1" step="0.01"/>
      <div class="slider-labels">
        <div class="scale-label">50.0</div>
        <div class="scale-label">0.0</div>
      </div>
    </div>
    <div class = "PID-numbers">
      <input type="number" id="Kp-value" min="0" max="50" step="0.1" value="1.0" />
      <input type="text" id="Ti-value" value="1.0" />
      <input type="number" id="Td-value" min="0" max="50" step="0.1" value="1.0" />
    </div>
</div>

    <!--Sliders-->
    <input type="range" id="top-slider"/>
    <input type="range" id="bot-slider"/>
    <!-- Grouped buttons-->

    <div id="control-button-group">
      <div class="control-title">Control Outputs</div>
      <div id="valve-controls">
        <button id="manual-btn" title="Toggle Manual Mode">Manual Mode</button>
        <button id="automatic-btn" title="Toggle Automatic Mode">Automatic Mode</button>
      </div>

      <hr class="divider" />
      <div id="valve-controls">
        <button id="control-upper-btn" title="Toggle control of the upper tank"> Control Upper</button>
        <button id="control-lower-btn" title="Toggle control of the lower tank"> Control Lower</button>
      </div>
    </div>


    <div id="controls">
      <button id="fill-btn">Fill</button>
      <button id="drain-btn">Stop Fill</button>
      <button id="clog-lower-btn"  title="Toggle lower clog">Clog lower</button>
      <button id="clog-upper-btn"  title="Toggle upper clog">Clog upper</button>
    </div>
    <div id="controls3">
      <button id="P-control" title="Toggle P control">P</button>
      <button id="I-control" title="Toggle I control">I</button>
      <button id="D-control" title="Toggle D control">D</button>
      <button id="pause-btn" title="Toggle Plot Freeze">Freeze Plots                 </button>
    </div>
    <div id="controls2">

    </div>

    <div id="Advanced-Options">
      <button id="options-button">...</button>
      <div id="options-menu" class="hidden">
        <div class="options-title">Advanced Options</div>
      
        <div id="clog-slider-box">
          <hr class="divider" />
          <div class="clog-section-label">Clog percentage</div>
          <div class="slider-paired-row">
            <input type="range" id="clog-slider" min="0" max="100" value="100" />
            <input type="number" id="clog-value" min="0" max="100" value="100" />
          </div>
          <hr class="divider" />
          <div class="title">Add more here</div>
                   <!--Add options here-->
          </div>
        </div>
      </div>
      
      <div id="pid-equation">
        $$ u(t) = K \left( e(t) + \frac{1}{T_i} \int_0^t e(\tau) d\tau + T_d \frac{de(t)}{dt} \right) $$
      </div>

</body>
</html>
