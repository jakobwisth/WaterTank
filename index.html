<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>p5.js Water Tank</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
    <script src="sketch.js"></script>
</head>

<body> 
    <div id="canvas-container"></div>

    <div id="inflow-slider-box">
        <div class="slider-title">Inflow rate (um) </div>
        <div class="slider-paired-row">
          <input type="range" id="inflow-slider" min="0" max="100" value="0" />
          <div class="slider-labels">
            <div class="scale-label">1.0</div>
            <div class="scale-label">0.5</div>
            <div class="scale-label">0.0</div>
          </div>
        </div>
        <input type="number" id="inflow-value" min="0" max="1" step="0.01" value="0.0" />
    </div>

    <div id="setpoint-slider-box">
      <div class="slider-title">Setpoint (r)</div>
      <div class="slider-paired-row">
        <input type="range" id="setpoint-slider" min="0" max="100" value="0" />
        <div class="slider-labels">
          <div class="scale-label">1.0</div>
          <div class="scale-label">0.5</div>
          <div class="scale-label">0.0</div>
        </div>
      </div>
      <input type="number" id="setpoint-value" min="0" max="1" step="0.01" value="0.0" />
  </div>

    <!--Sliders-->
    <input type="range" id="top-slider"/>
    <input type="range" id="bot-slider"/>
    <input type="range" id="speedup-slider"/>
    <!-- Grouped buttons-->
    <div id="controls">
      <button id="fill-btn">Fill</button>
      <button id="drain-btn">Stop Fill</button>
      <button id="pause-btn">Pause Simulation</button>
      <button id="control-btn">P control</button>
      <button id="clog-lower-btn">Clog lower</button>
      <button id="clog-upper-btn">Clog upper</button>
    </div>
</body>
</html>
