<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>p5.js Water Tank</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
    <script src="sketch.js"></script>
</head>

<body> 
    <div id="canvas-container"></div>

    <div id="inflow-slider-box">
        <div class="slider-title">Inflow rate (um) </div>
        <div class="slider-paired-row">
          <input type="range" id="inflow-slider" min="0" max="100" value="0" />
          <div class="slider-labels">
            <div class="scale-label">1.0</div>
            <div class="scale-label">0.5</div>
            <div class="scale-label">0.0</div>
          </div>
        </div>
        <input type="number" id="inflow-value" min="0" max="1" step="0.01" value="0.0" />
    </div>

    <div id="setpoint-slider-box">
      <div class="slider-title">Setpoint (r)</div>
      <div class="slider-paired-row">
        <input type="range" id="setpoint-slider" min="0" max="100" value="0" />
        <div class="slider-labels">
          <div class="scale-label">1.0</div>
          <div class="scale-label">0.5</div>
          <div class="scale-label">0.0</div>
        </div>
      </div>
      <input type="number" id="setpoint-value" min="0" max="1" step="0.01" value="0.0" />
  </div>

  <div id="PID-variables-slider-box">
    <div class = "PID-parameters">PID parameters</div>
    <div class="PID-titles">
      <div class="slider-title">Kp</div>
      <div class="slider-title">Ti</div>
      <div class="slider-title">Td</div>
    </div>
    <div class="slider-paired-row">
      <input type="range" id="Kp-slider" min="0" max="50" value="0"step="0.01" />
      <div class="slider-labels">
        <div class="scale-label">50.0</div>
        <div class="scale-label">0.0</div>
      </div>
      <input type="range" id="Ti-slider" min="0" max="50" value="0" step="0.01"/>
      <div class="slider-labels">
        <div class="scale-label">50.0</div>
        <div class="scale-label">0.0</div>
      </div>
      <input type="range" id="Td-slider" min="0" max="50" value="0" step="0.01"/>
      <div class="slider-labels">
        <div class="scale-label">50.0</div>
        <div class="scale-label">0.0</div>
      </div>
    </div>
    <div class = "PID-numbers">
      <input type="number" id="Kp-value" min="0" max="50" step="0.1" value="0.0" />
      <input type="number" id="Ti-value" min="0" max="50" step="0.1" value="0.0" />
      <input type="number" id="Td-value" min="0" max="50" step="0.1" value="0.0" />
    </div>
</div>


    <!--Sliders-->
    <input type="range" id="top-slider"/>
    <input type="range" id="bot-slider"/>
    <input type="range" id="speedup-slider"/>
    <!-- Grouped buttons-->
    <div id="controls">
      <button id="fill-btn">Fill</button>
      <button id="drain-btn">Stop Fill</button>
      <button id="pause-btn">Pause Simulation</button>
      <button id="control-btn">Enable Control</button>
      <button id="clog-lower-btn">Clog lower</button>
      <button id="clog-upper-btn">Clog upper</button>
    </div>
    <div id="controls2">
      <button id="control-upper-btn">Control upper</button>
      <button id="control-lower-btn">Control Lower</button>
    </div>
    <div id="controls3">
      <button id="P-control">P</button>
      <button id="I-control">I</button>
      <button id="D-control">D</button>
    </div>
</body>
</html>
